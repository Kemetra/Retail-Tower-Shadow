# Root CI for POS (RT-748 slice I-3). Defines the graph.yaml job keys pos/static,
# pos/test-shard-1..3, pos/test, pos/package-windows and pos/docs (static rule 5) by
# reproducing apps/pos/.github/workflows/ci.yml at the imported tree (POS@3c1cad5) inside
# apps/pos/. Job `name:` values are the graph keys, so each is a literal with no
# expression and there is no matrix (the three shards are three literal jobs). The
# workflow `name:` must stay `pos` (matched by the staged gate). PR-reachable: read-only
# token, no stored credentials, no environment. The only use of the job token is the
# "Fetch main tip" step in the three shard jobs (see the comment there).
#
# Differences from the product workflow, all forced by the project graph:
#  - the graph is the only selector, so the `changes` job, the `ci` aggregate and every
#    docs_only / needs_package `if:` are gone; no `paths:` filter. A selected job that is
#    skipped fails the gate, so every job below always runs.
#  - `pos/docs` therefore always Prettier-checks the md/json files this change touched
#    under apps/pos/ (the product only ran it for docs-only PRs).
#  - the informational coverage upload is not carried over (it needs a repo credential,
#    which PR-reachable workflows must not use); coverage is still collected and gated.
#  - run directory: `defaults.run.working-directory` does not apply to `uses:` steps, so
#    the npm cache path and the artifact paths carry the apps/pos/ prefix explicitly.
name: pos

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # RT-588: number of vitest shards. There are exactly three literal shard jobs below;
  # the merge job fails if the number of blob reports differs from this.
  TEST_SHARD_COUNT: 3

concurrency:
  # Per-workflow prefix so the product workflows never cancel each other on one ref; the
  # push-SHA suffix stops consecutive pushes to main from cancelling each other.
  group: pos-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/pos

jobs:
  pos-static:
    name: pos/static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Backend-Core contract conformance
        run: npm test -- tests/contract/backend-core

      - name: Verify OpenAPI codegen drift
        run: npm run codegen:verify

      - name: Build renderer (vite)
        run: npm run build:renderer

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # RT-588: the vitest suite is split across three runners (`vitest --shard=i/N`, a
  # deterministic partition by test file). Shards only COLLECT coverage into a blob report;
  # the thresholds are evaluated once, on the merged coverage, by `pos-test`.
  pos-test-shard-1:
    name: pos/test-shard-1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # src/renderer/__tests__/source-scope-guard.test.ts runs `git diff origin/main...HEAD`
      # and falls back to `git fetch origin main`. The product repo is public, so that fetch
      # works anonymously there; this repo is private and checkout does not persist
      # credentials, so fetch the main tip here, right after checkout and before any PR
      # code runs (npm ci included), with the read-only token passed to this one command
      # only (never written to .git/config). The refspec is forced (+) because on a push to
      # main, and on a re-run of an old run, checkout has already created origin/main at the
      # pushed SHA and a depth-1 fetch of a newer tip is otherwise rejected as non-fast-forward.
      - name: Fetch main tip for the source-scope guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --no-recurse-submodules --depth=1 origin +main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      # tests/contract/backend-core already ran (blocking) in pos/static.
      - name: Test shard 1 (coverage collected, not gated)
        run: >-
          npm test -- --coverage
          --config vitest.shard.config.ts
          --exclude 'tests/contract/backend-core/**'
          --shard=1/${TEST_SHARD_COUNT}
          --reporter=default --reporter=blob

      - name: Upload vitest blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-1
          path: apps/pos/.vitest-reports/
          # upload-artifact skips dot-directories unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pos-test-shard-2:
    name: pos/test-shard-2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch main tip for the source-scope guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --no-recurse-submodules --depth=1 origin +main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Test shard 2 (coverage collected, not gated)
        run: >-
          npm test -- --coverage
          --config vitest.shard.config.ts
          --exclude 'tests/contract/backend-core/**'
          --shard=2/${TEST_SHARD_COUNT}
          --reporter=default --reporter=blob

      - name: Upload vitest blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-2
          path: apps/pos/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pos-test-shard-3:
    name: pos/test-shard-3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch main tip for the source-scope guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --no-recurse-submodules --depth=1 origin +main:refs/remotes/origin/main

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Test shard 3 (coverage collected, not gated)
        run: >-
          npm test -- --coverage
          --config vitest.shard.config.ts
          --exclude 'tests/contract/backend-core/**'
          --shard=3/${TEST_SHARD_COUNT}
          --reporter=default --reporter=blob

      - name: Upload vitest blob report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-3
          path: apps/pos/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Merge job. Skipped (so the gate fails) unless EVERY shard succeeded (default success()).
  pos-test:
    name: pos/test
    needs: [pos-test-shard-1, pos-test-shard-2, pos-test-shard-3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Download shard blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: apps/pos/.vitest-reports

      # A missing blob would silently drop a slice of the suite from the merged report.
      - name: Check every shard blob is present
        shell: bash
        run: |
          count="$(find .vitest-reports -maxdepth 1 -name 'blob-*.json' | wc -l)"
          echo "blob reports: $count (expected $TEST_SHARD_COUNT)"
          ls -la .vitest-reports
          if [ "$count" != "$TEST_SHARD_COUNT" ]; then
            echo "::error::expected $TEST_SHARD_COUNT shard blob reports, found $count"; exit 1
          fi

      # The ONLY place coverage thresholds are evaluated: the unmodified vitest.config.ts
      # applied to coverage merged across all shards. Prints the whole-suite test totals.
      - name: Merge shard reports + coverage thresholds
        run: npm test -- --merge-reports --coverage

  pos-package-windows:
    name: pos/package-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      # Full install: postinstall runs electron-rebuild -f -w better-sqlite3.
      - name: Install dependencies
        run: npm ci

      # Electron-ABI argon2 for the packaged app.
      - name: Rebuild argon2 for Electron ABI (packaging)
        run: npx electron-rebuild -f -w argon2

      - name: Build (renderer + main + preload)
        run: npm run build

      - name: Package (Windows --dir, unsigned)
        run: npm run package:dir

      # Manual-smoke convenience artifact, not a gate: best-effort, main pushes only.
      - name: Upload unpacked Windows build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pos-pulse-win-unpacked-${{ github.sha }}
          path: apps/pos/dist-electron/win-unpacked
          retention-days: 1

  pos-docs:
    name: pos/docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Depth 2 makes the first parent available: HEAD^1..HEAD is this change's file set
      # (the PR merge commit against its base, or a pushed commit against its parent).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install dependencies (docs-only, skip postinstall)
        run: npm ci --ignore-scripts

      # Changed md/json files under apps/pos/, prefix stripped so Prettier resolves its
      # config from the product directory. Deleted files are excluded.
      - name: Prettier check (changed md/json)
        shell: bash
        run: |
          # The diff runs on its own line so a git failure (for example a missing HEAD^1)
          # fails the job instead of being swallowed by the filter pipeline below.
          diff_out="$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- .)"
          mapfile -t files < <(printf '%s\n' "$diff_out" | sed 's#^apps/pos/##' | grep -E '\.(md|json)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "Prettier-checking:"
            printf '  %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          else
            echo "No .md/.json files to Prettier-check."
          fi
